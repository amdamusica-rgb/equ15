<script>
const freqs=[25,40,63,100,160,250,400,630,1000,1600,2500,4000,6300,10000,16000];
let audio=document.getElementById('audio');

function initAudio(){
 if(ctx) return;
 ctx=new (window.AudioContext||window.webkitAudioContext)();
 let src=ctx.createMediaElementSource(audio);
 let prev=src;
 filters=[];
 freqs.forEach((f,i)=>{
   let filter=ctx.createBiquadFilter();
   if(i==0){filter.type='lowshelf';filter.frequency.value=f}
   else if(i==14){filter.type='highshelf';filter.frequency.value=f}
   else{filter.type='peaking';filter.frequency.value=f;filter.Q.value=1}
   filter.gain.value=0;
   prev.connect(filter);
   prev=filter;
   filters.push(filter);
 });
 prev.connect(ctx.destination);
}
function buildEQ(){
 let c=document.getElementById('eqContainer');
 c.innerHTML=freqs.map((f,i)=>{
   let label=f>=1000?(f/1000)+'K':f;
   return `<div class="eq-col"><div class="eq-val" id="v${i}">0</div><input type="range" id="s${i}" min="-12" max="12" value="0" step="1" oninput="setGain(${i},this.value)"><label>${label}</label></div>`
 }).join('');
}
function setGain(i,val){
 if(!ctx) initAudio();
 if(filters[i]) filters[i].gain.value=parseInt(val);
 let el=document.getElementById('v'+i);
 el.textContent=val>0?'+'+val:val;
 el.style.color=val>0?'#0f0':val<0?'#f00':'#fff';
 if(ctx && ctx.state=='suspended') ctx.resume();
}
