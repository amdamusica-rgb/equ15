<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EQ 15 BAND LITE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:sans-serif;padding:8px}
.box{border:2px solid #00ffff;border-radius:12px;padding:8px;margin-bottom:8px;background:#111}
.btn{border:none;border-radius:10px;padding:12px;font-weight:bold;width:100%;margin:5px 0}
.yellow{background:#ffeb00;color:#000}
.cyan{background:#00ffff;color:#000}
.audio{width:100%;margin:8px 0}
.item{background:#00ffff;color:#000;padding:8px;border-radius:8px;margin:4px 0;display:flex;justify-content:space-between;font-weight:bold}
.eq-scroll{display:flex;gap:4px;overflow-x:auto;padding:10px 5px;background:#000;border-radius:10px}
.eq-col{min-width:44px;text-align:center;background:#1a1a1a;border-radius:8px;padding:6px 2px;border:1px solid #333}
.eq-col input{width:32px;height:110px}
.eq-col label{font-size:10px;color:#ffeb00;display:block;font-weight:bold}
.val{font-size:12px;font-weight:bold}
.presets{display:flex;gap:4px;margin-top:8px}
.presets button{flex:1;padding:10px 2px;border-radius:8px;border:none;font-weight:bold;font-size:11px}
</style>
</head>
<body>
<div class="box">
<input type="file" id="file" accept="audio/*" multiple style="display:none">
<button class="btn yellow" onclick="document.getElementById('file').click()">+ TAMBAH LAGU</button>
<audio id="audio" class="audio" controls></audio>
<button id="eqBtn" class="btn cyan">EQ 15 BAND LITE ON ✅</button>
<div id="plist"></div>
<div style="color:#0f0;text-align:center;font-weight:bold"><span id="count">0 lagu</span></div>
</div>
<div class="box">
<div class="eq-scroll" id="eqContainer"></div>
<div class="presets">
<button onclick="preset('flat')" style="background:#444;color:#fff">FLAT</button>
<button onclick="preset('bass')" style="background:#00ffff">BASS</button>
<button onclick="preset('vocal')" style="background:#ffeb00">VOCAL</button>
<button onclick="preset('treble')" style="background:#f0f;color:#fff">TREBLE</button>
<button onclick="preset('smile')" style="background:#0f0">SMILE</button>
</div>
<div style="color:#ffeb00;font-size:10px;text-align:center;margin-top:6px">25 40 63 100 160 250 400 630 1K 1.6K 2.5K 4K 6.3K 10K 16K Hz</div>
</div>
<script>
const freqs=[25,40,63,100,160,250,400,630,1000,1600,2500,4000,6300,10000,16000];
let audio=document.getElementById('audio');
let ctx,filters=[],files=[];
function initAudio(){
 if(ctx) return;
 ctx=new(window.AudioContext||window.webkitAudioContext)();
 let src=ctx.createMediaElementSource(audio);
 let prev=src;
 filters=[];
 freqs.forEach((f,i)=>{
   let fl=ctx.createBiquadFilter();
   if(i==0){fl.type='lowshelf';fl.frequency.value=f}
   else if(i==14){fl.type='highshelf';fl.frequency.value=f}
   else{fl.type='peaking';fl.frequency.value=f;fl.Q.value=1}
   fl.gain.value=0;prev.connect(fl);prev=fl;filters.push(fl);
 });
 prev.connect(ctx.destination);
}
function buildEQ(){
 let c=document.getElementById('eqContainer');
 c.innerHTML=freqs.map((f,i)=>{
   let lb=f>=1000?(f/1000)+'K':f;
   return `<div class="eq-col"><div class="val" id="v${i}">0</div><input type="range" id="s${i}" min="-12" max="12" value="0" oninput="setGain(${i},this.value)"><label>${lb}</label></div>`
 }).join('');
}
function setGain(i,v){
 if(!ctx) initAudio();
 if(filters[i]) filters[i].gain.value=parseInt(v);
 let e=document.getElementById('v'+i);e.textContent=v>0?'+'+v:v;
 e.style.color=v>0?'#0f0':v<0?'#f00':'#fff';
 if(ctx&&ctx.state=='suspended') ctx.resume();
}
function preset(t){
 let m={
   flat:[0,0,0,0,0,0,0],
   bass:[6,5,4,3,1,0,0,0,0,0,-1],
   vocal:[-1,-1,0,0,1,2,3,4,4,3,2,1,0,0,0],
   treble:[-2,-1,0,0,0,0,0,0,0,1,2,3,4,5,6],
   smile:[5,4,2,0,-1,-2,-2,-1,0,0,1,2,3,4,5]
 };
 m[t].forEach((v,i)=>{document.getElementById('s'+i).value=v;setGain(i,v);});
}
document.getElementById('file').addEventListener('change',e=>{
 files=[...files,...Array.from(e.target.files)];
 let pl=document.getElementById('plist');
 pl.innerHTML=files.map((f,i)=>`<div class="item" onclick="loadFile(${i})"><span>${i+1}.${f.name.slice(0,18)}</span><span onclick="event.stopPropagation();files.splice(${i},1);document.getElementById('count').textContent=files.length+' lagu';document.getElementById('plist').innerHTML=''" style="color:red"> X</span></div>`).join('');
 document.getElementById('count').textContent=files.length+' lagu';
 if(files.length) loadFile(0);
});
function loadFile(i){
 let f=files[i];if(!f) return;
 audio.src=URL.createObjectURL(f);audio.play();initAudio();
 if(ctx&&ctx.state=='suspended') ctx.resume();
}
document.getElementById('eqBtn').addEventListener('click',()=>{initAudio();if(ctx.state=='suspended') ctx.resume();});
audio.addEventListener('play',()=>{initAudio();if(ctx.state=='suspended') ctx.resume();});
buildEQ();
</script>
</body>
</html>
