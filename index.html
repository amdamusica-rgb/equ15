<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaGunner EQ 15 BAND PRO MAX 8D</title>
<style> *{box-sizing:border-box} body{margin:0;background:#05070a;color:#fff;font-family:system-ui;padding:12px;text-align:center} h1{font-weight:900} h1 span{color:#00e5ff} .sub{color:#00e5ff;font-weight:700;font-size:13px} .console{background:#121a26;border:2px solid #2a3a4a;border-radius:16px;padding:12px;max-width:980px;margin:auto} .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px} .btn{padding:10px 18px;border-radius:22px;border:none;font-weight:900} .btn-yellow{background:linear-gradient(#ffeb3b,#ff9800);color:#000} .btn-pink{background:linear-gradient(#ff4081,#c51162);color:#fff} .btn-cyan{background:linear-gradient(#00e5ff,#0097a7);color:#fff} .btn-8d{background:linear-gradient(#7c4dff,#00e5ff);color:#fff;border:2px solid #00e5ff} .btn-8d.on{background:#00e5ff;color:#000;box-shadow:0 0 15px #00e5ff} input[type=text]{background:#0a101a;border:1px solid #2a3a4a;color:#fff;border-radius:10px;padding:10px;width:100%;max-width:360px} .grid15{display:grid;grid-template-columns:repeat(5,1fr);gap:4px} .card{background:#1a2535;border:1px solid #2a3a4a;border-radius:10px;padding:6px} .card label{font-size:7px;font-weight:800;display:block;height:22px} .card input{width:100%} .val{background:#000;border-radius:4px;padding:2px;font-size:9px;margin-top:4px} audio{width:100%;margin-top:10px} canvas{width:100%;height:70px;background:#000;border-radius:10px;margin-top:8px} </style>
</head>
<body>
<h1>TaGunner EQ <span style="color:#00e5ff">15 BAND PRO MAX 8D</span><br>เทสๆ 8D</h1>
<div class="sub">🎧 BISA BUNYI BOS - 15 BAND + 8D + BASS BOOST</div>
<div class="console">
<div class="row">
<label class="btn btn-yellow">+ TAMBAH LAGU <input type="file" id="fileIn" accept="audio/*" style="display:none"></label>
<button class="btn btn-pink" id="linkBtn">PLAY LINK</button>
<button class="btn btn-cyan" id="playBtn">▶ PLAY TEST BASS</button>
<button class="btn btn-8d" id="btn8d">8D OFF</button>
</div>
<div class="row"><input type="text" id="linkIn" placeholder="Paste link MP3 / YouTube bos"></div>
<audio id="audio" controls crossorigin="anonymous"></audio>
<canvas id="vis"></canvas>
<div class="grid15" id="eqGrid"></div>
</div>
<script>
const freqs=[25,40,63,100,160,250,400,630,1000,1600,2500,4000,6300,10000,16000];
const grid=document.getElementById('eqGrid'); const audio=document.getElementById('audio');
let ctx,filters=[],gainNode,panner,bassF,analyser,src,is8D=false,lfoTimer,oscNodes=[];
freqs.forEach((f,i)=>{ const d=document.createElement('div'); d.className='card'; d.innerHTML=`<label>${f>=1000?f/1000+'K':f}Hz</label><input type="range" id="f${i}" min="-12" max="12" value="0"><div class="val" id="v_f${i}">0 dB</div>`; grid.appendChild(d); });
function initAudio(){ if(ctx) return; ctx=new AudioContext(); gainNode=ctx.createGain(); panner=ctx.createStereoPanner(); bassF=ctx.createBiquadFilter(); bassF.type='lowshelf'; bassF.frequency.value=120; analyser=ctx.createAnalyser(); analyser.fftSize=256; filters=freqs.map((f,idx)=>{ const fil=ctx.createBiquadFilter(); if(idx==0){fil.type='lowshelf';fil.frequency.value=f;} else if(idx==freqs.length-1){fil.type='highshelf';fil.frequency.value=f;} else {fil.type='peaking';fil.frequency.value=f;fil.Q.value=1;} fil.gain.value=0; return fil; }); for(let i=0;i<filters.length-1;i++) filters[i].connect(filters[i+1]); filters[filters.length-1].connect(bassF); bassF.connect(panner); panner.connect(gainNode); gainNode.connect(analyser); analyser.connect(ctx.destination); src=ctx.createMediaElementSource(audio); src.connect(filters[0]); }
function connectOscTest(){ initAudio(); oscNodes.forEach(o=>{try{o.stop()}catch{}}); oscNodes=[]; const o1=ctx.createOscillator(), o2=ctx.createOscillator(), og=ctx.createGain(); o1.frequency.value=55; o2.frequency.value=110; og.gain.value=0.7; o1.connect(og); o2.connect(og); og.connect(filters[0]); o1.start(); o2.start(); oscNodes=[o1,o2,og]; audio.pause(); }
document.getElementById('fileIn').addEventListener('change',e=>{ const file=e.target.files[0]; if(!file) return; audio.src=URL.createObjectURL(file); audio.play(); initAudio(); });
document.getElementById('linkBtn').onclick=()=>{ const url=document.getElementById('linkIn').value.trim(); if(!url) return alert('Paste link dulu bos'); audio.src=url; audio.play(); initAudio(); };
document.getElementById('playBtn').onclick=async()=>{ initAudio(); await ctx.resume(); if(audio.src){ audio.paused?audio.play():audio.pause(); } else{ connectOscTest(); } };
freqs.forEach((_,i)=>{ document.getElementById(`f${i}`).addEventListener('input',e=>{ if(filters[i]) filters[i].gain.value=parseFloat(e.target.value); document.getElementById(`v_f${i}`).textContent=e.target.value+' dB'; }); });
document.getElementById('btn8d').onclick=function(){ initAudio(); is8D=!is8D; this.textContent=is8D?'8D ON 🌀':'8D OFF'; this.classList.toggle('on',is8D); clearInterval(lfoTimer); if(is8D){ lfoTimer=setInterval(()=>{ panner.pan.value=Math.sin(Date.now()/700)*0.9; },20); } else { panner.pan.value=0; } };
const canvas=document.getElementById('vis'), cctx=canvas.getContext('2d'); function draw(){ requestAnimationFrame(draw); if(!analyser) return; const data=new Uint8Array(analyser.frequencyBinCount); analyser.getByteFrequencyData(data); cctx.fillStyle='#000'; cctx.fillRect(0,0,canvas.width,canvas.height); const barW=canvas.width/data.length*2; let x=0; for(let i=0;i<data.length;i++){ const h=data[i]/255*canvas.height; cctx.fillStyle=`hsl(${180+data[i]},100%,50%)`; cctx.fillRect(x,canvas.height-h,barW,h); x+=barW+1; } } draw(); canvas.width=canvas.offsetWidth;
</script>
</body>
</html>
